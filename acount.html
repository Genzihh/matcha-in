<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Matcha-In</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="background-color: #F9F9F5;">

    <header>
        <nav class="nav-links">
            <a href="./shop.html">Shop</a>
            <a href="./index.html">Home</a>
        </nav>
        <div class="logo">
            <a href="./index.html"><img src="./images/logo.png" alt="Matcha-In Logo"></a>
        </div>
        <div class="user-actions">
            <a href="./account.html" style="text-decoration: underline;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </a>
            <a href="javascript:void(0)" onclick="toggleCart()" class="cart-icon-wrapper">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span id="cart-count-badge" class="cart-badge">0</span>
            </a>
        </div>
    </header>

    <main class="login-page-container">
        <div class="login-title-side">
            <h1>Login</h1>
            <a href="./home.html" class="return-link">Return to Store</a>
        </div>

        <div class="login-form-side">
            <form action="#">
                <div class="login-input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="login-input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                </div>
                
                <button type="submit" class="btn-sign-in">Sign In</button>

                <div class="login-extra-links">
                    <a href="#">Create account</a>
                    <a href="#">Forgot your password?</a>
                </div>
            </form>
        </div>
    </main>

    <div id="cart-overlay" class="overlay" onclick="toggleCart()"></div>
    <div id="cart-drawer" class="cart-drawer">
        <div class="cart-header">
            <h2>Your cart</h2>
            <button class="close-btn" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-content"></div>
        <div class="cart-footer-section">
            <div class="subtotal-row"><span>Subtotal</span><span class="subtotal-price">Rp0</span></div>
            <button class="checkout-btn">Check Out</button>
        </div>
    </div>

    <script src="1.js"></script>

    <footer class="site-footer">
        <div class="footer-main">
            
            <div class="footer-nav-wrapper">
                <nav class="footer-nav-links">
                    <a href="#">About us</a>
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms</a>
                    <a href="#">FAQs</a>
                    <a href="#">Refunds</a>
                </nav>
            </div>

            <div class="footer-contact-area">
                <p class="made-with-love">made with love!</p>
                <a href="mailto:hello@matchain.com" class="footer-email">hello@matchain.com</a>
                
                <div class="social-icons">
                    <a href="#" aria-label="Instagram">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    </a>
                    <a href="#" aria-label="TikTok">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path></svg>
                    </a>
                    <a href="#" aria-label="YouTube">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>
                    </a>
                </div>
            </div>
        </div>

        <div class="footer-bottom">
            <div class="region-selector">
                <select id="country">
                    <option value="ID">Indonesia (IDR Rp)</option>
                    <option value="US">United States (USD $)</option>
                </select>
            </div>
            <div class="copyright">
                <p>© 2025 Matcha-In·</p>
            </div>
        </div>
    </footer>
    <script src="./script.js"></script>
</body>
</html>
